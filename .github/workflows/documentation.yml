name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build user guide and API reference
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Build existing Jekyll user guide
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          baseurl: /${{ github.event.repository.name }}

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz

      - name: Build API reference
        run: |
          bash doc/build-api.sh "$RUNNER_TEMP/intarna-api"
          # The Jekyll container creates its output as root.
          sudo chown -R "$(id -u):$(id -g)" _site
          cp -R "$RUNNER_TEMP/intarna-api/html" _site/api

      - name: Check generated documentation
        run: |
          python3 doc/check-api.py _site/api
          test -s _site/index.html
          test -s _site/doc/figures/icon-up.28.png

      - name: Upload documentation for the combined Pages site
        uses: actions/upload-artifact@v4
        with:
          name: intarna-documentation
          path: _site
          retention-days: 7
