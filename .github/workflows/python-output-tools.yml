name: Python output tools

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  output-tools:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python: '3.10'
            dependencies: numpy==1.23.5 scipy==1.9.3 matplotlib==3.6.3
          - python: '3.13'
            dependencies: -r python/requirements-output-tools.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ${{ matrix.dependencies }}
      - run: python -m unittest discover -s python/tests -v
        env:
          MPLBACKEND: Agg
